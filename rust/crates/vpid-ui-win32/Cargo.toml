[package]
name = "vpid-ui-win32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "vpid Windows 原生 UI（Win32 API：消息循环 / 窗口 / GDI 双缓冲自绘 / 控件）"

[[bin]]
name = "vpid-viewer"
path = "src/main.rs"

[dependencies]
vpid-core = { path = "../vpid-core" }
vpid-ui-core = { path = "../vpid-ui-core" }
windows-sys = { workspace = true }

# 发布硬化：编译期生成 VERSIONINFO + 清单 + 图标 + BuildDate（见 build.rs）
[build-dependencies]
winres = "0.1"
