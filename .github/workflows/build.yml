name: Build

on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run CMake + MSVC build (SOUI5, x86)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DVPID_UI_STYLE=SOUI
          cmake --build build --config Release -- /m
          Get-Item build/Release/vpid_viewer.exe | Select-Object Name, Length
          echo "=== imported DLLs (should be system libs only) ==="
          dumpbin /imports build/Release/vpid_viewer.exe | Select-String '\.dll"'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_windows_x86_${{ github.sha }}
          path: build/Release/vpid_viewer.exe
          retention-days: 7

  # Linux 双路径：
  #   - SOUI5 + swinx（默认，跨平台 UI 层统一）
  #   - GTK3（legacy 回退，-DVPID_UI_STYLE=GTK）
  build-linux-soui:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install deps (swinx: Cairo/xcb/fontconfig + libudev)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ cmake pkg-config \
            libcairo2-dev libfontconfig1-dev libfreetype6-dev libpixman-1-dev \
            libxcb1-dev libxkbcommon-dev libdbus-1-dev libudev-dev
          # swinx 自带 xcb-util 系列作为子模块，无需系统安装

      - name: Build vpid_viewer (SOUI5 + swinx)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=SOUI
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer

  build-linux-gtk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deps (GTK3 + libusb)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ cmake pkg-config \
            libgtk-3-dev libusb-1.0-0-dev

      - name: Build vpid_viewer (GTK3 legacy)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=GTK
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer