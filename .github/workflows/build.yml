name: Build

on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            mingw-w64-i686-binutils
            make
            git
            unzip

      - name: Build vpid_viewer (i686, Win32 API, fully static, UPX compressed)
        shell: msys2 {0}
        run: |
          set -eux
          curl -sL -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          unzip -o upx.zip -d upx
          UPX_DIR="$(dirname "$(find upx -name upx.exe -print -quit)")"
          export PATH="$UPX_DIR:$PATH"
          upx --version | head -1
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          echo "=== imported DLLs (should be system libs only) ==="
          objdump -p build/vpid_viewer.exe | grep -E 'DLL Name' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_windows_x86_${{ github.sha }}
          path: build/vpid_viewer.exe
          retention-days: 7
