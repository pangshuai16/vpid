name: Build

# 非 main 分支：只构建，不发布
# 与 release 完全相同的三目标构建矩阵，仅跳过发布步骤：
#   windows-x86   原生 Win32 API，MSYS2 MINGW32 (i686) 静态链接（XP 兼容）
#   linux-amd64   原生 GTK3 + libusb，Rocky Linux 8（glibc 2.28）
#   linux-arm64   同上，QEMU 模拟 aarch64 / Rocky Linux 8
on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            mingw-w64-i686-binutils
            mingw-w64-i686-upx
            make
            git

      - name: Build vpid_viewer (i686, Win32 API, fully static)
        shell: msys2 {0}
        run: |
          set -eux
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          echo "=== imported DLLs (should be system libs only) ==="
          objdump -p build/vpid_viewer.exe | grep -E 'DLL Name' || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_windows_x86_${{ github.sha }}
          path: build/vpid_viewer.exe
          retention-days: 7

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            name: vpid_viewer_linux_amd64
            platform: linux/amd64
          - arch: arm64
            name: vpid_viewer_linux_arm64
            platform: linux/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # arm64 需 QEMU 模拟（x86 host 运行 aarch64 容器）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in Rocky Linux 8 container (${{ matrix.arch }}, glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/rockylinux/rockylinux:8
          options: --platform ${{ matrix.platform }} -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            dnf install -y epel-release
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel pkgconfig
            rm -rf build && mkdir -p build
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            ls -lh build/vpid_viewer
            objdump -T build/vpid_viewer | grep -m1 GLIBC || true
            cp build/vpid_viewer build/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}_${{ github.sha }}
          path: build/${{ matrix.name }}
          retention-days: 7