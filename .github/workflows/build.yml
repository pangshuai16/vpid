name: Build

on:
  push:
    branches-ignore: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== CMake version ==="
          cmake --version

      - name: Configure CMake (Windows x86)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DVPID_UI_STYLE=SOUI

      - name: Build (Windows x86)
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=== Build output ==="
          Get-Item build/Release/vpid_viewer.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpid_viewer_windows_x86_${{ github.sha }}
          path: build/Release/vpid_viewer.exe
          retention-days: 7

  build-linux-soui:
    needs: [build-windows-x86]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Install deps (swinx: Cairo/xcb/fontconfig + libudev)"
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ cmake pkg-config \
            libcairo2-dev libfontconfig1-dev libfreetype6-dev libpixman-1-dev \
            libxcb1-dev libxkbcommon-dev libdbus-1-dev libudev-dev

      - name: Check environment
        run: |
          echo "=== CMake version ==="
          cmake --version

      - name: Configure CMake (Linux amd64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=SOUI

      - name: Build (Linux amd64)
        run: |
          cmake --build build -j"$(nproc)"

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -lh build/bin/vpid_viewer
