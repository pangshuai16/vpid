name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run CMake + MSVC build (SOUI5, x86)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DVPID_UI_STYLE=SOUI
          cmake --build build --config Release -- /m
          Get-Item build/Release/vpid_viewer.exe | Select-Object Name, Length
          # CLI 自检：直接执行 USB 扫描（runner 无 USB 设备时 count=0 属正常，
          # 关键验证扫描链路可用、进程不崩溃）；exit != 0 会使步骤失败
          & build\Release\vpid_viewer.exe --scan
          if ($LASTEXITCODE -ne 0) { throw "vpid_viewer --scan failed with exit code $LASTEXITCODE" }
          echo "=== imported DLLs (should be system libs only) ==="
          $vsDir = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcvars = Join-Path $vsDir "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvars`" x86 >nul 2>&1 && dumpbin /imports build\Release\vpid_viewer.exe" | Select-String '\.dll'
          Copy-Item build/Release/vpid_viewer.exe build/vpid_viewer_windows_x86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_x86
          path: build/vpid_viewer_windows_x86.exe
          retention-days: 30

  build-linux-soui:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "Install deps (swinx: Cairo/xcb/fontconfig + libudev + libusb)"
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ cmake pkg-config \
            libcairo2-dev libfontconfig1-dev libfreetype6-dev libpixman-1-dev \
            libxcb1-dev libxkbcommon-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev \
            libx11-dev libxext-dev libxrender-dev libxi-dev libxtst-dev libglib2.0-dev

      - name: Build vpid_viewer (SOUI5 + swinx)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=SOUI
          # 诊断：dbus 编译单元的 -I 是否命中本库生成的 config.h（flags.make）
          echo "=== dbus-1 flags.make C_INCLUDES ==="
          grep "C_INCLUDES" build/third_party/soui/swinx/thirdparty/dbus-1.14.10/dbus/CMakeFiles/dbus-1.dir/flags.make 2>/dev/null | head -3 || echo "flags.make not found"
          echo "=== dbus config.h key macros ==="
          grep -n "HAVE_STDINT_H\|^#define VERSION\|DBUS_SESSION_BUS_CONNECT" build/third_party/soui/swinx/thirdparty/dbus-1.14.10/config.h 2>/dev/null | head -10 || echo "config.h not found"
          cmake --build build -j"$(nproc)"
          cp build/vpid_viewer build/vpid_viewer_linux_amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/vpid_viewer_linux_amd64
          retention-days: 30

  # Linux arm64（多平台推送发布：与 README 的 x64/arm64 声明一致）
  build-linux-soui-arm64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build vpid_viewer (SOUI5 + swinx, arm64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work ubuntu:22.04 bash -c '
            apt-get update && apt-get install -y git cmake pkg-config g++ \
              libcairo2-dev libfontconfig1-dev libfreetype6-dev libpixman-1-dev \
              libxcb1-dev libxkbcommon-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev \
              libx11-dev libxext-dev libxrender-dev libxi-dev libxtst-dev libglib2.0-dev &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=SOUI &&
            cmake --build build -j"$(nproc)" &&
            cp build/vpid_viewer build/vpid_viewer_linux_arm64
          '
          ls -lh build/vpid_viewer_linux_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: build/vpid_viewer_linux_arm64
          retention-days: 30

  release:
    needs: [build-windows-x86, build-linux-soui, build-linux-soui-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true