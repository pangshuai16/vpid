name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== CMake version ==="
          cmake --version
          Write-Host "=== MSVC version ==="
          $vsDir = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS installation: $vsDir"
          & "$vsDir\VC\Tools\MSVC\" | ForEach-Object { Write-Host "MSVC: $($_.Name)" }

      - name: Configure CMake (Windows x86)
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 -DVPID_UI_STYLE=SOUI

      - name: Build (Windows x86)
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Verify build output
        shell: pwsh
        run: |
          Write-Host "=== Build output ==="
          Get-Item build/Release/vpid_viewer.exe | Select-Object Name, Length, LastWriteTime
          Write-Host "=== Build successful ==="

      - name: CLI self-test (non-fatal)
        shell: pwsh
        run: |
          Write-Host "=== Running --scan self-test ==="
          try {
            & build\Release\vpid_viewer.exe --scan
            Write-Host "Exit code: $LASTEXITCODE"
            if (Test-Path "build\Release\vpid_scan_result.txt") {
              Get-Content build\Release\vpid_scan_result.txt
            }
          } catch {
            Write-Host "Self-test failed (non-fatal): $_"
          }
          exit 0

      - name: Check imports (non-fatal)
        shell: pwsh
        run: |
          Write-Host "=== Imported DLLs ==="
          try {
            $vsDir = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
            $vcvars = Join-Path $vsDir "VC\Auxiliary\Build\vcvarsall.bat"
            cmd /c "`"$vcvars`" x86 >nul 2>&1 && dumpbin /imports build\Release\vpid_viewer.exe" | Select-String '\.dll'
          } catch {
            Write-Host "dumpbin failed (non-fatal): $_"
          }
          exit 0

      - name: Copy artifact
        shell: pwsh
        run: |
          Copy-Item build/Release/vpid_viewer.exe build/vpid_viewer_windows_x86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_x86
          path: build/vpid_viewer_windows_x86.exe
          retention-days: 30

  build-linux-soui:
    needs: [build-windows-x86]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deps (swinx: Cairo/xcb/fontconfig + libudev + libusb)
        run: |
          sudo apt-get update && sudo apt-get install -y gcc g++ cmake pkg-config \
            libcairo2-dev libfontconfig1-dev libfreetype6-dev libpixman-1-dev \
            libxcb1-dev libxkbcommon-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev \
            libx11-dev libxext-dev libxrender-dev libxi-dev libxtst-dev libglib2.0-dev

      - name: Check environment
        run: |
          echo "=== CMake version ==="
          cmake --version
          echo "=== GCC version ==="
          gcc --version | head -1

      - name: Configure CMake (Linux amd64)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=SOUI

      - name: Build (Linux amd64)
        run: |
          cmake --build build -j"$(nproc)"

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -lh build/bin/vpid_viewer
          echo "=== Build successful ==="

      - name: Copy artifact
        run: |
          cp build/bin/vpid_viewer build/vpid_viewer_linux_amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: build/vpid_viewer_linux_amd64
          retention-days: 30

  build-linux-soui-arm64:
    needs: [build-linux-soui]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build vpid_viewer (SOUI5 + swinx, arm64)
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/work -w /work ubuntu:22.04 bash -c '
            echo "=== Installing deps ===" &&
            apt-get update && apt-get install -y git cmake pkg-config g++ \
              libcairo2-dev libfontconfig1-dev libfreetype6-dev libpixman-1-dev \
              libxcb1-dev libxkbcommon-dev libdbus-1-dev libudev-dev libusb-1.0-0-dev \
              libx11-dev libxext-dev libxrender-dev libxi-dev libxtst-dev libglib2.0-dev &&
            echo "=== CMake version ===" && cmake --version &&
            echo "=== Configuring ===" &&
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVPID_UI_STYLE=SOUI &&
            echo "=== Building ===" &&
            cmake --build build -j"$(nproc)" &&
            echo "=== Copying artifact ===" &&
            cp build/bin/vpid_viewer build/vpid_viewer_linux_arm64
          '
          ls -lh build/vpid_viewer_linux_arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-arm64
          path: build/vpid_viewer_linux_arm64
          retention-days: 30

  release:
    needs: [build-windows-x86, build-linux-soui, build-linux-soui-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true
