name: Release

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            mingw-w64-i686-binutils
            make
            git
            unzip

      - name: Build vpid_viewer (i686, Win32 API, fully static, UPX compressed)
        shell: msys2 {0}
        run: |
          set -eux
          curl -sL -o upx.zip https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          unzip -o upx.zip -d upx
          UPX_DIR="$(dirname "$(find upx -name upx.exe -print -quit)")"
          export PATH="$UPX_DIR:$PATH"
          upx --version | head -1
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          echo "=== imported DLLs (should be system libs only) ==="
          objdump -p build/vpid_viewer.exe | grep -E 'DLL Name' || true
          cp build/vpid_viewer.exe build/vpid_viewer_windows_x86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_x86
          path: build/vpid_viewer_windows_x86.exe
          retention-days: 30

  release:
    needs: build-windows-x86
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true
