name: Release

# main 分支：构建并发布，构建矩阵与 build.yml 完全一致：
#   windows-x86 / linux-amd64 / linux-arm64
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW32 (i686 toolchain)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: false
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-make
            mingw-w64-i686-binutils
            mingw-w64-i686-upx
            make
            git

      - name: Build vpid_viewer (i686, Win32 API, fully static)
        shell: msys2 {0}
        run: |
          set -eux
          rm -rf build && mkdir -p build
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
          ls -lh build/vpid_viewer.exe
          echo "=== imported DLLs (should be system libs only) ==="
          objdump -p build/vpid_viewer.exe | grep -E 'DLL Name' || true
          cp build/vpid_viewer.exe build/vpid_viewer_windows_x86.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows_x86
          path: build/vpid_viewer_windows_x86.exe
          retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            name: vpid_viewer_linux_amd64
            platform: linux/amd64
          - arch: arm64
            name: vpid_viewer_linux_arm64
            platform: linux/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build in Rocky Linux 8 container (${{ matrix.arch }}, glibc 2.28)
        uses: addnab/docker-run-action@v3
        with:
          image: quay.io/rockylinux/rockylinux:8
          options: --platform ${{ matrix.platform }} -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            dnf install -y epel-release
            dnf install -y gcc-c++ make cmake libusb1-devel gtk3-devel pkgconfig
            rm -rf build && mkdir -p build
            cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
            cmake --build build -j"$(nproc)"
            ls -lh build/vpid_viewer
            objdump -T build/vpid_viewer | grep -m1 GLIBC || true
            cp build/vpid_viewer build/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: build/${{ matrix.name }}
          retention-days: 30

  release:
    needs:
      - build-windows-x86
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Inspect artifacts
        run: ls -lhR artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: artifacts/**/*
          generate_release_notes: true